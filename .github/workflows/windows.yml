name: Windows client

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example windows-v1.0.0 (main only)"
        required: false
        type: string
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test-and-package:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'windows-v') }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Code signing is opt-in and driven by repository secrets. When both are
      # unset, electron-builder receives an empty CSC_LINK, treats it as "no
      # certificate configured", and produces unsigned installers as before.
      # Set WINDOWS_CODE_SIGNING_CERTIFICATE to the base64 of a .pfx, and
      # WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD to its password.
      CSC_LINK: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        working-directory: windows
        run: npm ci

      - name: Test and type-check
        working-directory: windows
        run: npm test

      - name: Build Windows installers
        working-directory: windows
        run: npm run package:win

      - name: Verify the signature when signing is configured
        if: ${{ env.CSC_LINK != '' }}
        shell: pwsh
        run: |
          # A signature that is merely present is not enough: only a valid,
          # timestamped signature makes Windows trust the file. Check every
          # binary a user or Windows itself will load.
          $signableFiles = @(Get-ChildItem "windows/release/Clickaa-Setup-*.exe") +
            @(Get-ChildItem "windows/release/win-unpacked/Clickaa.exe")

          foreach ($file in $signableFiles) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($file.Name) is not validly signed: $($signature.Status) - $($signature.StatusMessage)"
            }
            Write-Host "$($file.Name) is signed by $($signature.SignerCertificate.Subject) and timestamped."
          }

      - name: Validate Windows installers
        working-directory: windows
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: npm run validate:installers

      - name: Smoke-test packaged x64 application
        working-directory: windows
        shell: pwsh
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          $applicationPath = Resolve-Path "release/win-unpacked/Clickaa.exe"
          $standardOutputPath = Join-Path $env:RUNNER_TEMP "clickaa-smoke-stdout.log"
          $standardErrorPath = Join-Path $env:RUNNER_TEMP "clickaa-smoke-stderr.log"
          $clickaaProcess = Start-Process `
            -FilePath $applicationPath `
            -PassThru `
            -RedirectStandardOutput $standardOutputPath `
            -RedirectStandardError $standardErrorPath

          try {
            Start-Sleep -Seconds 10
            if ($clickaaProcess.HasExited) {
              Write-Host "Clickaa exited with code $($clickaaProcess.ExitCode)."
              if (Test-Path $standardOutputPath) { Get-Content $standardOutputPath }
              if (Test-Path $standardErrorPath) { Get-Content $standardErrorPath }
              throw "The packaged x64 application did not stay running."
            }
            Write-Host "Packaged x64 application remained healthy for the smoke-test window."
          }
          finally {
            if (-not $clickaaProcess.HasExited) {
              Stop-Process -Id $clickaaProcess.Id -Force
            }
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: clickaa-windows-installers
          path: windows/release/Clickaa-Setup-*.exe
          if-no-files-found: error

      - name: Publish Windows GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REF_NAME -ne "main") {
            throw "Windows releases must be dispatched from the main branch."
          }

          $packageManifest = Get-Content "windows/package.json" | ConvertFrom-Json
          $expectedReleaseTag = "windows-v$($packageManifest.version)"
          if ($env:RELEASE_TAG -ne $expectedReleaseTag) {
            throw "Release tag must match package version: $expectedReleaseTag"
          }

          $installerPaths = Get-ChildItem "windows/release/Clickaa-Setup-*.exe"
          if ($installerPaths.Count -ne 2) {
            throw "Expected exactly two Windows installers, found $($installerPaths.Count)."
          }

          $releaseNotesPath = Join-Path $env:RUNNER_TEMP "clickaa-windows-release-notes.md"

          # Say what is actually true of this build rather than assuming it is
          # unsigned, so the notes never promise a warning that will not appear
          # or stay silent about one that will.
          $signingNote = if ($env:CSC_LINK) {
            "The installers are code-signed and timestamped, so Windows should accept them without an unknown-publisher warning. Smart App Control may still withhold judgement until the signature has built up reputation in Microsoft's app intelligence service."
          } else {
            "The installers are currently unsigned, and Windows treats unknown publishers two different ways. SmartScreen shows an unrecognized-app warning that **More info → Run anyway** clears. Smart App Control, which is on by default on clean Windows 11 installs, blocks unsigned apps outright and offers no way to allow a single one, so those machines cannot install this build. See windows/README.md for the certificate situation."
          }

          @"
          Clickaa for Windows $($packageManifest.version).

          This release contains per-user NSIS installers for Windows x64 and ARM64. After installation, open Clickaa from the notification area, then paste either your own Gemini API key or a deployed Cloudflare Worker URL and select **save & test**.

          $signingNote
          "@ | Set-Content $releaseNotesPath

          $releaseArguments = @(
            "release", "create", $env:RELEASE_TAG,
            "--target", $env:GITHUB_SHA,
            "--title", "Clickaa for Windows $($packageManifest.version)",
            "--notes-file", $releaseNotesPath
          ) + $installerPaths.FullName

          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed."
          }

      - name: Attach installers to published Windows release
        if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'windows-v') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: windows/release/Clickaa-Setup-*.exe
          fail_on_unmatched_files: true
