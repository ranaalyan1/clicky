<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; media-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hitodama Open overlay</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./brand.css">
  <link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <div id="buddy" class="buddy" data-state="idle" aria-hidden="true">
    <div class="response-stack">
      <div id="point-label" class="point-label"></div>
      <div id="response-bubble" class="response-bubble"></div>
    </div>
    <div class="visual-wrap">
      <span class="glow"></span>
      <span class="cursor-triangle"></span>
      <span class="listening-ring"></span>
      <span class="processing-spinner"></span>
      <span class="waveform">
        <i></i><i></i><i></i><i></i><i></i>
      </span>
    </div>
  </div>
  <script type="module" src="./overlay.js"></script>
</body>
</html>
